<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Graph Image - DesktopRenamer</title>

    <!-- Google Fonts matching the website -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'klein-blue': '#002FA7',
                        'klein-blue-text': '#5B8DEF',
                        'bg-dark': '#01071a',
                        'gold': '#E8C97A',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        editorial: ['Playfair Display', 'serif'],
                    },
                }
            }
        }
    </script>
    <style>
        /* Exact noise overlay from the website's hero */
        .noise-bg {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 256px 256px;
        }

        /* Premium Fading Blueprint Grid */
        .architectural-grid {
            background-size: 60px 60px;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
            mask-image: radial-gradient(ellipse at 50% 50%, black 10%, transparent 75%);
            -webkit-mask-image: radial-gradient(ellipse at 50% 50%, black 10%, transparent 75%);
        }
    </style>
</head>

<body class="bg-gray-900 min-h-screen flex flex-col items-center justify-center p-8">

    <div class="text-white/50 mb-6 font-sans text-sm tracking-wide text-center">
        <p>1200 &times; 630px Open Graph Image Canvas.</p>
        <p>Use your screenshot tool to capture the exact container below.</p>
    </div>

    <!-- 1200x630 OG Canvas -->
    <div id="og-canvas"
        class="w-[1200px] h-[630px] bg-[#010514] relative overflow-hidden shadow-2xl flex items-center shrink-0">

        <!-- 1. Deep Void Background -->
        <div class="absolute inset-0 bg-gradient-to-br from-black via-[#010514] to-[#000d3a] opacity-100 z-0"></div>

        <!-- 2. Noise Texture -->
        <div class="absolute inset-0 noise-bg mix-blend-overlay z-0 pointer-events-none"></div>

        <!-- 3. Elegant Fading Blueprint Grid -->
        <div class="absolute inset-0 architectural-grid z-0 pointer-events-none"></div>

        <!-- 4. Studio Spotlight (Centered precisely behind the right composition) -->
        <div
            class="absolute right-[20px] top-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-klein-blue rounded-full blur-[130px] opacity-40 mix-blend-screen pointer-events-none z-0">
        </div>

        <!-- Content Wrapper with strictly locked boundaries -->
        <div class="absolute inset-0 w-full h-full px-[100px] flex justify-between items-center z-10">

            <!-- Left Side: Typography (Strict Width) -->
            <div class="flex flex-col shrink-0 w-[520px]">

                <!-- Clean, Human-Crafted Brand Lockup -->
                <div class="flex items-center gap-4 mb-6">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1039.8 581.48" fill="white"
                        class="w-8 h-8 opacity-90 drop-shadow-md">
                        <path fill-rule="evenodd"
                            d="M634.68,10c0-5.5-2.48-6.24-5.51-1.65l-244.88,370.96c-3.03,4.59-5.51,12.85-5.51,18.35v173.83c0,5.5,4.5,10,10,10h235.9c5.5,0,10-4.5,10-10V10Z" />
                        <path fill-rule="evenodd"
                            d="M379.26,10c0-5.5-2.48-6.24-5.5-1.65L1.41,573.13c-3.03,4.59-1,8.35,4.5,8.35H241.47c5.5,0,12.48-3.76,15.5-8.35l116.77-177.13c3.03-4.59,5.5-12.85,5.5-18.35V10Z" />
                        <path
                            d="M1033.98,581.48c5.5,0,7.45-3.71,4.34-8.25l-237.54-346.18c-3.11-4.54-10.16-8.25-15.66-8.25h-109.7c-5.5,0-10,4.5-10,10v342.67c0,5.5,4.5,10,10,10h358.56Z" />
                        <path
                            d="M790.05,211.64c2.79,4.74,7.36,4.74,10.15,0L919.75,8.62C922.54,3.88,920.32,0,914.82,0h-239.41c-5.5,0-7.72,3.88-4.93,8.62l119.55,203.03Z" />
                    </svg>
                    <div class="h-5 w-[2px] bg-white/20 rounded-full"></div>
                    <span class="text-white/70 font-sans text-[1.2rem] tracking-tight font-medium pt-px">macOSer
                        Series</span>
                </div>

                <!-- Main Title -->
                <h1 class="text-white text-[4.5rem] font-bold tracking-[-0.04em] leading-none mb-6 drop-shadow-sm">
                    DesktopRenamer
                </h1>

                <!-- Subtitle / Tagline -->
                <p class="text-white/80 text-[2.1rem] font-light leading-[1.35] tracking-[-0.02em]">
                    Rename your experiences.<br />
                    Take back control of your <br />
                    <span
                        class="font-editorial italic bg-clip-text text-transparent bg-gradient-to-br from-klein-blue-text to-gold font-medium pr-2">macOS
                        spaces.</span>
                </p>
            </div>

            <!-- Right Side: Layered Composition (Strictly confined boundaries) -->
            <div class="shrink-0 w-[440px] h-[440px] relative z-20">

                <!-- Midground: App Snapshot (True-centered & Tilted) -->
                <!-- We use ml-[15px] instead of translate-x to safely offset the centered element -->
                <img src="https://raw.githubusercontent.com/gitmichaelqiu/gitmichaelqiu.github.io/main/resources/works/desktop-renamer-full-dark.png"
                    alt=""
                    class="absolute top-1/2 left-1/2 w-[460px] h-auto object-contain rounded-xl border border-white/10 opacity-60 shadow-2xl transform -translate-x-1/2 -translate-y-1/2 rotate-3 ml-[15px] blur-[1px]"
                    onerror="this.src='https://raw.githubusercontent.com/gitmichaelqiu/gitmichaelqiu.github.io/main/resources/works/desktop-renamer-full.png'" />

                <!-- Foreground: Crisp App Icon (True-centered & Offset) -->
                <!-- We use -ml-[40px] mt-[20px] instead of translate variables to safely offset the centered element -->
                <img src="https://raw.githubusercontent.com/gitmichaelqiu/gitmichaelqiu.github.io/main/resources/works/desktop-renamer.png"
                    alt="DesktopRenamer App Icon"
                    class="absolute top-1/2 left-1/2 z-10 w-[280px] h-auto drop-shadow-[0_40px_80px_rgba(0,0,0,0.9)] transform -translate-x-1/2 -translate-y-1/2 -ml-[40px] mt-[20px] -rotate-2"
                    onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iMzAwIiB2aWV3Qm94PSIwIDAgMjQgMjQiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2ZmZiIgc3Ryb2tlLXdpZHRoPSIxIiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiPjxyZWN0IHg9IjMiIHk9IjMiIHdpZHRoPSIxOCIgaGVpZ2h0PSIxOCIgcng9IjIiIHJ5PSIyIj48L3JlY3Q+PC9zdmc+'" />

            </div>

        </div>
    </div>

</body>

</html>
